summary: >-
  I am a product owner who moved from chemical engineering into banking. At Bank Mandiri I worked on digital lending,
  payments and risk technology, turning conditions set by business, risk and legal teams into flows, user stories and
  acceptance criteria that could be tested. I am now studying for an MSc in Financial Data Science at UCD Smurfit in
  Dublin and building credit risk models in Python, because I want to work where product, data and governance meet.
